# Validation tolerances, uncertainties and digital-twin settings. Delete any key to use the built-in default.
# Uncertainties are expanded U95 (k=2) in % unless the key says pp (percentage points).
standard_conditions:
  temperature_degc: 15.0
  pressure_kpa: 101.325
data_quality:
  frozen_days: 4
  spike_window_days: 7
  spike_mad_k: 5.0
  spike_min_rel: 0.15
  ranges:
    thp_ksc:
    - 0
    - 350
    flp_ksc:
    - 0
    - 100
    chp_ksc:
    - 0
    - 350
    choke_64ths:
    - 2
    - 128
    hours_on:
    - 0
    - 24
    test_hours:
    - 0
    - 24
    lift_gas_sm3:
    - 0
    - 200000
    spm:
    - 0
    - 20
    pressure_ksc:
    - 0
    - 100
    temperature_degc:
    - -5
    - 120
    oil_leg_bsw_pct:
    - 0
    - 100
    bsw_pct:
    - 0
    - 100
    level_mm:
    - 0
    - 20000
    liquid_temp_degc:
    - -5
    - 95
well_test:
  min_duration_h: 4.0
  recommended_duration_h: 8.0
  age_warn_days: 30
  age_alarm_days: 60
  stability_last_hours: 4
  stability_cv_warn: 0.1
  stability_cv_alarm: 0.2
  liquid_change_warn: 0.2
  liquid_change_alarm: 0.4
  wc_change_warn_pp: 10.0
  wc_change_alarm_pp: 20.0
  gor_change_warn: 0.3
  gor_change_alarm: 0.6
  srp_ve_max: 1.05
  srp_ve_min: 0.3
  wc_sample_vs_meter_pp: 5.0
  choke_cal_change_warn: 0.25
vfm:
  correlation: gilbert
  critical_flow_ratio: 0.55
  deviation_warn: 0.2
  deviation_alarm: 0.4
  persist_days: 2
  thp_high_ratio: 1.5
well_model:
  enabled: true
  use_in_dvr: true
  estimator_u95_pct:
    choke: 20.0
    nodal: 15.0
    ipr_fl: 15.0
    ipr_pip: 10.0
    ipr_gauge: 8.0
    srp_pd: 20.0
  aging_pct_per_day: 0.3
  fl_survey_max_age_days: 7
  fl_aging_pct_per_day: 1.5
  annulus_factor: 0.9
  default_wht_degc: 35.0
  default_reservoir_temp_degc: 75.0
  pi_change_warn: 0.25
  min_submergence_m: 50.0
  fillage_warn_pct: 70.0
  dfl_rise_warn_m: 100.0
  inj_pressure_shift: 0.1
  conflict_sigma: 3.0
  deviation_warn: 0.2
  deviation_alarm: 0.4
  persist_days: 2
  sample_max_age_days: 7
  sample_wc_u95_pp: 5.0
  sample_aging_pp_per_day: 0.5
  sample_vs_test_warn_pp: 10.0
separator:
  gas_capacity_warn: 0.8
  gas_capacity_alarm: 1.0
  k_vertical_ms: 0.055
  k_horizontal_10ft_ms: 0.122
  gas_area_fraction_horizontal: 0.5
  imbalance_warn: 0.1
  imbalance_alarm: 0.2
tank:
  level_sigma_mm: 2.0
  free_water_sigma_mm: 3.0
  temperature_sigma_c: 0.5
  density_sigma_kgm3: 1.0
  bsw_sigma_pp: 0.1
  drain_u95_pct: 10.0
uncertainty:
  meter_u95_pct:
    coriolis: 0.5
    pd: 0.5
    turbine: 1.0
    ultrasonic: 1.0
    vortex: 2.0
    orifice: 2.0
    venturi: 1.5
    mag: 1.0
    estimate: 30.0
    flare_estimate: 25.0
  proving_overdue_factor: 2.0
  shrinkage_u95_pct: 2.0
  oil_leg_bsw_u95_pp: 2.0
  dispatch_bsw_u95_pp: 0.2
  well_liquid_u95_pct: 10.0
  well_wc_u95_pp: 4.0
  well_gor_u95_pct: 20.0
  fresh_test_days: 7
  aging_liquid_pct_per_day: 0.5
  aging_wc_pp_per_day: 0.2
  aging_gor_pct_per_day: 1.0
  provisional_factor: 1.5
  no_test_u95_pct: 100.0
dvr:
  alpha: 0.05
  z_warn: 1.96
  max_eliminations: 3
  persistent_days: 3
twin:
  compressor_capacity_sm3d: 50000.0
  lift_gas_available_sm3d: 34000.0
  fuel_fraction: 0.03
  dispatch_rate_m3h: 12.0
  dispatch_start_frac: 0.6
  dispatch_stop_frac: 0.35
  lookahead_hours: 72
  forecast_days: 90
  gl_min_sm3d: 3000.0
  gl_max_sm3d: 14000.0
  gl_step_sm3d: 250.0
  gl_curve_step_sm3d: 500.0
  choke_min_64: 6
  choke_max_64: 32
  choke_step_64: 2
  spm_min: 4.0
  spm_max: 10.0
  max_drawdown: 0.35
  target_submergence_m: 100.0
  min_gain_pct: 2.0
  test_capacity_per_day: 1
  autonomy:
    mode: autonomous_sim
    cycles: 12
    max_step_gl_sm3d: 1500.0
    max_step_choke_64: 2
    max_step_spm: 1.0
    max_total_gl_sm3d: 3000.0
    max_total_choke_64: 4
    max_total_spm: 2.0
    min_move_gain_m3d: 0.05
    min_gl_saving_sm3d: 500.0
    verify_tolerance_pct: 3.0
    plant_pi_mismatch_sd: 0.12
    plant_noise_pct: 1.5
    freeze_on_untrusted:
    - lift_header
    - lift_gas
    seed: 7
allocation:
  reference: tank
  af_warn:
  - 0.9
  - 1.1
  af_alarm:
  - 0.8
  - 1.2
