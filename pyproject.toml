[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtwin"
version = "1.1.0"
description = "GGS well-to-tank flow validation, reconciliation, allocation and digital twin (FlowTwin)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "pyyaml>=6.0", "openpyxl>=3.0"]

[project.optional-dependencies]
app = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10,<4",
]
dev = ["flowtwin[app]", "httpx>=0.27", "pytest>=8", "ruff>=0.5"]

[project.scripts]
flowval = "flowval.cli:main"
flowtwin = "app.backend.cli:main"

[tool.setuptools.packages.find]
include = ["flowval*", "app*"]

[tool.setuptools.package-data]
"app.backend" = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["app/frontend", "output", "data"]

[tool.ruff.lint]
# Conservative: real bugs only (pyflakes + a few pycodestyle errors). The engine is not reformatted.
select = ["F", "E9", "E7", "B006", "B008"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing unused imports/variables in the engine: tidy in a separate, behaviour-neutral commit.
"flowval/**" = ["F401", "F841"]
"scripts/**" = ["F401"]
"tests/test_*.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests/app"]
